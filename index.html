<div id="demo-prouzek" class="skryto">DEMO — ukázková data, změny se neukládají</div>

<!-- brána -->
<div id="brana">
  <div class="brana-box">
    <div class="logo"><b>POUTNÍK</b> <span>KOKPIT</span></div>
    <div class="pod">půjčovna expedičních vozů</div>
    <form id="brana-form">
      <input id="brana-heslo" type="password" placeholder="heslo" autocomplete="current-password" autofocus>
      <button class="btn hlavni" type="submit">Odemknout</button>
    </form>
    <div class="brana-chyba" id="brana-chyba"></div>
    <div class="kdo-mrizka skryto" id="brana-kdo"></div>
    <div class="brana-info" id="brana-info"></div>
  </div>
</div>

<!-- appka -->
<div id="app" class="skryto">
  <header class="hl">
    <div class="hl-obsah">
      <div class="znacka"><b>POUTNÍK</b> <span>KOKPIT</span></div>
      <div class="hl-akce">
        <button class="hl-btn" id="btn-zvon" title="Upozornění"><svg class="icon"><use href="#i-zvon"/></svg><span class="puntik skryto" id="zvon-pocet"></span></button>
        <button class="hl-btn" id="btn-obnovit" title="Obnovit data"><svg class="icon"><use href="#i-obnovit"/></svg></button>
        <button class="hl-btn" id="btn-nastaveni" title="Nastavení"><svg class="icon"><use href="#i-ozubene"/></svg></button>
        <button class="ja-chip" id="btn-ja" title="Přihlášený uživatel"><span class="kolecko" id="ja-inic">?</span><span id="ja-jmeno"></span></button>
      </div>
    </div>
    <nav class="zalozky" id="zalozky" role="tablist"></nav>
  </header>
  <main id="plocha"></main>
</div>

<div id="zaclona" class="skryto"></div>
